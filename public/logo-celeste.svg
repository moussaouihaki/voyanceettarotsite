<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1540"/>
      <stop offset="100%" stop-color="#07040d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d988"/>
      <stop offset="40%" stop-color="#d4af6f"/>
      <stop offset="100%" stop-color="#8a6f3a"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c875"/>
      <stop offset="100%" stop-color="#c9943a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="87" fill="none" stroke="url(#gold)" stroke-width="0.3" opacity="0.25"/>

  <!-- Star accents -->
  <polygon points="152,42 153.5,46 157.5,46 154.5,48.5 155.5,52.5 152,50 148.5,52.5 149.5,48.5 146.5,46 150.5,46" fill="url(#gold)" opacity="0.7"/>
  <circle cx="46" cy="58" r="1.5" fill="#e8c875" opacity="0.6"/>
  <circle cx="158" cy="145" r="1.2" fill="#d4af6f" opacity="0.5"/>
  <circle cx="42" cy="138" r="1" fill="#e8c875" opacity="0.4"/>
  <circle cx="130" cy="165" r="0.8" fill="#e8c875" opacity="0.5"/>

  <!-- The "C" - path based for crisp rendering at any size -->
  <!-- Elegant serif C centered in the circle -->
  <text
    x="108"
    y="138"
    font-family="Georgia, 'Times New Roman', Palatino, serif"
    font-size="118"
    font-weight="400"
    text-anchor="middle"
    fill="url(#gold2)"
    font-style="normal"
    letter-spacing="-3"
  >C</text>

  <!-- Subtle top dot accent -->
  <circle cx="100" cy="22" r="1.8" fill="url(#gold)" opacity="0.6"/>
  <circle cx="100" cy="178" r="1.8" fill="url(#gold)" opacity="0.6"/>
</svg>
